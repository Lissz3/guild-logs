# Air live-reload config for the Go API.  Run `air` from the project root.
# Written for Windows. On macOS/Linux use:
#   cmd = "go build -o ./tmp/guildlogs ./cmd/guildlogs"
#   bin = "./tmp/guildlogs"
root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/guildlogs.exe ./cmd/guildlogs"
  bin = "tmp\\guildlogs.exe"
  # Rebuild on Go changes and on JSON changes (internal/config/default.json is
  # embedded in the binary; config.json is read at startup).
  include_ext = ["go", "json"]
  exclude_dir = ["tmp", "frontend", "node_modules", ".cache", ".git"]
  exclude_regex = ["_test\\.go$"]
  delay = 500
  stop_on_error = true

[log]
  time = false

[misc]
  clean_on_exit = true
